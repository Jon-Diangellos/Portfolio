<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contato - Jonathas</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <h1>Contato</h1>
        <nav>
            <a href="index.html">Início</a>
            <a href="sobre.html">Sobre</a>
            <a href="contato.html">Contato</a>
        </nav>
    </header>

    <main>
        <section>
            <h2>Me envie uma mensagem</h2>
<form onsubmit="enviarWhatsapp(event)">
    <label>Nome:</label>
    <input type="text" id="nome" placeholder="Seu nome" required>

    <label>Email:</label>
    <input type="email" id="email" placeholder="Seu email" required>

    <label>WhatsApp:</label>
    <input type="tel" id="whats" placeholder="(11) 90000-0000" required>

    <label>Mensagem:</label>
    <textarea id="mensagem" placeholder="Digite sua mensagem" required></textarea>

    <button type="submit">Enviar pelo WhatsApp</button>
</form>

<script>
function enviarWhatsapp(e) {
    e.preventDefault();

    const nome = document.getElementById("nome").value;
    const email = document.getElementById("email").value;
    const whats = document.getElementById("whats").value;
    const mensagem = document.getElementById("mensagem").value;

    const texto = encodeURIComponent(
        ` Novo contato do site:\n\n` +
        ` Nome: ${nome}\n` +
        ` Email: ${email}\n` +
        ` WhatsApp: ${whats}\n\n` +
        ` Mensagem:\n${mensagem}`
    );

    
    const numero = "5561998725445";

    window.open(`https://wa.me/${numero}?text=${texto}`, "_blank");
}
</script>

        </section>
    </main>

    <footer>
        <p>© 2025 - Desenvolvido por Jonathas</p>
    </footer>
</body>
</html>
